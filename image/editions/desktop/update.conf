{
  "product_id": "quantumos-desktop",
  "architecture": "x86_64",
  "state_dir": "/var/lib/quantumos/update",
  "public_key": "/usr/share/quantumos/keys/update-ed25519.pub",
  "bootloader": "systemd-boot",
  "esp_dir": "/efi",
  "entries_dir": "/efi/loader/entries",
  "health_deadline": 300.0,
  "health_check_timeout": 60.0,
  "health_checks": [
    {"name": "root-readonly", "builtin": "root_readonly"},
    {"name": "state-mounted", "builtin": "state_writable"},
    {"name": "display-manager", "argv": ["systemctl", "is-active", "--quiet", "display-manager.service"]},
    {"name": "qosd-active", "argv": ["systemctl", "is-active", "--quiet", "qosd.service"]},
    {"name": "qosd-socket", "builtin": "socket_probe"},
    {"name": "qosd-self-test", "argv": ["/usr/bin/qosd", "--self-test"]}
  ]
}
